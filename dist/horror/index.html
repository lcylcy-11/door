<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<meta name="description" content="같은 방, 달라지는 문. 시각적 단서로 반복되는 방을 통과하는 2D 공포 게임.">
<title>문 너머</title><link rel="stylesheet" href="./loop.css"><link rel="preload" as="image" href="./assets/loop-room-base.png">
</head>
<body>
<main id="scene" class="scene" tabindex="0" aria-label="반복되는 방과 문">
<svg id="world" class="world" shape-rendering="crispEdges" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<button id="handle" class="hotspot handle" aria-label="문손잡이. 누른 채 옆으로 끌기" aria-keyshortcuts="Enter ArrowLeft ArrowRight Space" disabled></button>
<button id="peephole" class="hotspot peephole" aria-label="스파이홀. 누르는 동안 다음 방 보기" aria-keyshortcuts="KeyP" hidden></button>
<svg id="gesture" class="gesture" viewBox="-70 -55 140 110" width="140" height="110" aria-hidden="true"></svg>
<div id="meter" class="meter" role="meter" aria-label="문의 상태" aria-valuemin="0" aria-valuemax="100" hidden><svg id="meterIcon" class="meter-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"></svg><div class="track"><span id="safeBand" class="safe-band"></span><span id="meterFill" class="fill"></span></div></div>
<div class="vignette" aria-hidden="true"></div><div id="danger" class="danger" aria-hidden="true"></div><div id="blackout" class="blackout" aria-hidden="true"></div>
</main>
<script src="./loop.js"></script><script src="./loop-art.js"></script><script src="./sound.js"></script><script src="./loop-props.js"></script><script src="./loop-game.js"></script>
</body></html>
