<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="문을 열고, 붙잡는 손에 버티고, 눈을 피하며 닫는 짧은 1인칭 공포 게임.">
  <title>문 좀 살살 — 문틈</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preload" as="image" href="./assets/apartment.png">
  <link rel="preload" as="image" href="./assets/door.png">
</head>
<body>
<main class="game-page">
  <section class="scene" id="scene" tabindex="0" aria-label="중문을 바라보는 1인칭 화면" data-view="front">
    <div class="stage" id="stage">
      <svg id="front" class="view-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <clipPath id="opening"><rect x="700" y="80" width="488" height="695"/></clipPath>
          <clipPath id="glassClip"><rect x="747" y="112" width="379" height="407"/></clipPath>
          <clipPath id="fingerClip"><rect id="fingerClipRect" x="1154" y="420" width="75" height="140"/></clipPath>
          <clipPath id="latchCaps"><rect x="1138.7" y="584.75" width="24" height="18.45"/><rect x="1137.95" y="651.65" width="25.2" height="18"/><rect x="1138.1" y="715.7" width="25.5" height="38.25"/></clipPath>
          <filter id="blur9" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
          <mask id="eyeMask" maskUnits="userSpaceOnUse" x="900" y="200" width="320" height="140"><ellipse cx="1060" cy="272" rx="100" ry="42" fill="#fff" filter="url(#blur9)"/></mask>
          <radialGradient id="shadowFoot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#020404" stop-opacity=".9"/><stop offset="1" stop-color="#020404" stop-opacity="0"/></radialGradient>
          <linearGradient id="stairLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0d4" stop-opacity=".02"/><stop offset="1" stop-color="#cfe0d4" stop-opacity=".42"/></linearGradient>
          <linearGradient id="ajarLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9cfc7" stop-opacity=".2"/><stop offset=".6" stop-color="#b9cfc7" stop-opacity=".7"/><stop offset="1" stop-color="#b9cfc7" stop-opacity=".9"/></linearGradient>
        </defs>
        <image class="plate" href="./assets/apartment.png" x="0" y="0" width="1600" height="900" preserveAspectRatio="none"/>
        <g clip-path="url(#opening)">
          <rect id="corridorShade" x="700" y="80" width="488" height="695" fill="#03100f" opacity=".08"/>
          <rect id="ajarStrip" x="996" y="239" width="6" height="316" fill="url(#ajarLight)" opacity="0" filter="url(#blur3)"/>
          <polygon id="stairStrip" points="960,560 1010,560 1188,770 1100,770" fill="url(#stairLight)" opacity="0" filter="url(#blur3)"/>
          <g id="feetShadows" opacity="0"><ellipse cx="1080" cy="738" rx="24" ry="30" fill="url(#shadowFoot)"/><ellipse cx="1118" cy="736" rx="24" ry="30" fill="url(#shadowFoot)"/></g>
          <g id="eyes" opacity="0">
            <image id="eyesImage" href="./assets/eyes.webp" x="959.4" y="234.6" width="202.4" height="74.4" mask="url(#eyeMask)" preserveAspectRatio="none"/>
            <circle class="glint" cx="1014" cy="270" r="1.6"/><circle class="glint" cx="1111" cy="270" r="1.6"/>
          </g>
          <g id="doorGroup">
            <image href="./assets/door.png" x="510" y="80" width="860" height="695" preserveAspectRatio="none"/>
            <g clip-path="url(#glassClip)">
              <path id="silhouette" opacity="0" filter="url(#blur9)" fill="#0b0a08" d="M905 175c-36 0-62 32-62 74 0 31 14 55 32 66-60 15-100 61-112 133l-8 140h300l-8-140c-12-72-52-118-112-133 19-11 33-35 33-66 0-42-28-74-63-74z"/>
              <g id="palm" opacity="0" filter="url(#blur3)"><path fill="#0b0a08" d="M1000 300c-18 0-30 14-30 34v60c0 26 20 46 46 46h22c26 0 44-20 44-46v-34c0-12-9-20-20-20-3-24-12-44-28-44-6-18-18-24-34 4z"/></g>
            </g>
            <g id="latch">
              <image href="./assets/latch-body.webp" x="1124" y="566" width="53.9" height="194.1" preserveAspectRatio="none"/>
              <image id="bolt" href="./assets/latch-bolt.webp" x="1141.9" y="552.7" width="31.6" height="161.2" preserveAspectRatio="none"/>
              <image href="./assets/latch-body.webp" x="1124" y="566" width="53.9" height="194.1" preserveAspectRatio="none" clip-path="url(#latchCaps)"/>
              <line id="boltGuide" x1="1182" y1="588" x2="1182" y2="623" opacity="0"/><line id="boltDetent" x1="1178" y1="615.6" x2="1186" y2="615.6" opacity="0"/>
            </g>
          </g>
          <image id="hand" href="./assets/hand.png" x="1000" y="490" width="380" height="253" opacity="0"/>
          <image id="handGrip" href="./assets/hand-grip.png" x="930" y="405" width="420" height="280" opacity="0"/>
        </g>
        <rect id="scuff" x="1008" y="776" width="114" height="8" fill="#b9a786" opacity=".12"/>
        <rect id="underDoor" x="700" y="771" width="488" height="5" fill="#f0c27a" opacity="0"/>
        <g id="footGaps" opacity="0"><rect x="1040" y="770" width="28" height="7" fill="#050404"/><rect x="1092" y="770" width="28" height="7" fill="#050404"/></g>
        <ellipse id="floorHole" cx="1150" cy="779" rx="7" ry="2.5" fill="#060403" opacity=".15"/>
        <g class="knock-mark" id="floorKnock" opacity="0"><path d="M760 790l-8 16m43-12v22m34-27 8 17"/></g>
        <g class="knock-mark" id="glassKnock" opacity="0"><path d="M0 0l-10-12m22 2v-16m20 14 10-12"/></g>
      </svg>
      <svg id="rear" class="view-svg" viewBox="0 0 1600 900" aria-hidden="true"></svg>
      <button id="handle" class="hotspot handle" aria-label="문손잡이. 누른 채 좌우로 끌기. 손이 붙잡으면 → 힘 싣기, ← 힘 빼기" aria-keyshortcuts="Enter ArrowLeft ArrowRight Space" disabled></button>
      <button id="boltHit" class="hotspot prop" aria-label="걸쇠 잠그기. 한 번 눌러 잠금" aria-keyshortcuts="ArrowUp ArrowDown" disabled></button>
    </div>
    <div class="brow" id="brow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="rear-vignette" id="rearVignette" aria-hidden="true"></div>
    <div class="fade" id="fade" aria-hidden="true"></div>
    <div class="hud sound-strip" id="soundStrip" role="meter" aria-label="바깥 소리" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="track" aria-hidden="true"><span class="tick"></span><span class="fill" id="maskFill"></span></div>
      <div class="track attention" id="attentionTrack" aria-hidden="true" hidden><span class="fill" id="attentionFill"></span><span class="warn" style="left:45%"></span><span class="warn" style="left:75%"></span></div>
    </div>
    <div class="hud force" id="forcePanel" role="meter" aria-label="버티는 힘" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="track" aria-hidden="true"><span id="forceBand" class="band"></span><span id="forceFill" class="fill"></span></div>
    </div>
  </section>
</main>
<script src="./tuning.js"></script><script src="./contours.js"></script><script src="./night.js"></script><script src="./captions.js"></script><script src="./sound.js"></script><script src="./game.js"></script>
</body>
</html>
